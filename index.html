<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#5e7fae" />
<title>TRAFFIC ESCAPE — Deluxe</title>
<style>
  :root{--ink:#17304c;--blue:#5779aa;--panel:#ffffffdf;--gold:#ffbf33}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 25% 8%,#e6f2ff 0 13%,transparent 33%),linear-gradient(150deg,#9db6d7,#647fa9)}
  #app{width:min(100vw,560px);height:min(100svh,900px);position:relative;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#91acd0,#d7e3f3 23%,#b7cae3);box-shadow:0 16px 48px #19345177}
  header{height:96px;flex:none;padding:calc(10px + env(safe-area-inset-top)) 16px 9px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:3}
  .topBtn,.circleBtn{border:0;color:white;font:800 16px inherit;background:linear-gradient(#83a7d6,#4d6f9e);box-shadow:inset 0 2px #ffffff88,0 4px 0 #385778,0 7px 12px #28436255;cursor:pointer;transition:.15s transform}.topBtn:active,.circleBtn:active{transform:translateY(3px);box-shadow:inset 0 2px #ffffff88,0 1px 0 #385778}
  .topBtn{border-radius:18px;padding:11px 14px}.circleBtn{border-radius:50%;width:45px;height:45px;font-size:21px}
  .stage{position:absolute;left:50%;top:15px;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 2px 2px #31557b;font-weight:900;letter-spacing:.08em}.stage b{font-size:25px;display:block;line-height:1}.stage span{font-size:11px;opacity:.9}
  .stat{position:absolute;z-index:4;top:105px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:6px 15px 6px 7px;background:#edf8ff;border:3px solid white;border-radius:18px;box-shadow:0 4px 0 #6983a1,0 7px 16px #304a6855;font-weight:900;font-size:18px}.badge{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#ffdc59,#f79122);color:white;text-shadow:0 2px #bd5523;font-size:15px}
  #gameWrap{position:relative;flex:1;min-height:0;padding:30px 10px 8px}canvas{width:100%;height:100%;display:block;border-radius:24px;touch-action:manipulation}
  .bottom{height:94px;flex:none;padding:8px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;z-index:3}.power{width:65px;height:65px;border:0;border-radius:20px;background:linear-gradient(#fff,#d7e8f8);box-shadow:inset 0 2px white,0 4px 0 #7292b2,0 7px 12px #38587744;color:#54789c;font-size:27px;font-weight:bold;cursor:pointer;position:relative}.power:active{transform:translateY(3px);box-shadow:inset 0 2px white,0 1px 0 #7292b2}.power small{position:absolute;right:-5px;bottom:-4px;width:23px;height:23px;border-radius:9px;background:#f39b2d;color:white;display:grid;place-items:center;border:2px solid white;font:900 12px inherit}
  #toast{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.85);z-index:8;opacity:0;pointer-events:none;background:#203c5ddd;color:white;border:2px solid #fff8;border-radius:16px;padding:11px 18px;font-weight:900;white-space:nowrap;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #modal{position:absolute;inset:0;z-index:10;display:none;place-items:center;background:#17355488;backdrop-filter:blur(4px)}#modal.show{display:grid}.card{width:min(86%,380px);text-align:center;padding:27px 22px 23px;border-radius:28px;background:linear-gradient(#fff,#e2f0ff);border:4px solid white;box-shadow:0 12px 0 #385a7e,0 22px 35px #142e4d88}.card h1{margin:0;color:#f58a28;text-shadow:0 2px white;font-size:31px}.stars{font-size:43px;letter-spacing:4px;color:#ffbd2e;text-shadow:0 3px #c87925;margin:10px 0}.card p{font-weight:800;margin:4px 0 20px}.next{border:0;border-radius:16px;padding:14px 30px;background:linear-gradient(#78d866,#3ca94e);color:white;box-shadow:inset 0 2px #ffffff99,0 5px #26783b;font:900 18px inherit;cursor:pointer}.next:active{transform:translateY(4px);box-shadow:inset 0 2px #ffffff99,0 1px #26783b}
  @media(max-height:690px){header{height:78px;padding-top:8px}.stat{top:83px}.bottom{height:78px}.power{width:52px;height:52px;font-size:22px}.stage{top:10px}.stage b{font-size:21px}}
</style>
</head>
<body><main id="app">
  <header><button class="topBtn" id="restart">↻　やり直す</button><div class="stage"><span>TRAFFIC ESCAPE</span><b id="stageNo">STAGE 1</b></div><button class="circleBtn" id="sound">♫</button></header>
  <div class="stat"><i class="badge">🚘</i><span>残り <b id="remaining">0</b> 台</span></div>
  <div id="gameWrap"><canvas id="game"></canvas></div>
  <div class="bottom"><button class="power" id="hint">💡<small>3</small></button><button class="power" id="shuffle">↻<small>1</small></button></div>
  <div id="toast"></div><div id="modal"><section class="card"><h1>STAGE CLEAR!</h1><div class="stars">★★★</div><p id="clearText">すべての車を脱出させました！</p><button class="next" id="next">つぎへ　▶</button></section></div>
</main>
<script>
(() => {
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const els={remaining:document.querySelector('#remaining'),stage:document.querySelector('#stageNo'),toast:document.querySelector('#toast'),modal:document.querySelector('#modal'),next:document.querySelector('#next'),restart:document.querySelector('#restart'),sound:document.querySelector('#sound'),hint:document.querySelector('#hint'),shuffle:document.querySelector('#shuffle')};
let W=0,H=0,unit=50,ox=0,oy=0,cars=[],stage=0,muted=false,animating=false,hintUses=3,shuffleUses=1;
const palette={red:['#ff5d53','#bd252b'],orange:['#ff9d31','#d6511d'],yellow:['#ffd447','#db8e1e'],green:['#59dc55','#19934f'],cyan:['#48dff0','#139ac4'],blue:['#4b9af3','#2057bd'],purple:['#b65ae9','#7021ae'],pink:['#f453ad','#ba2478'],brown:['#b5683b','#71311f']};
const D={L:{x:-1,y:0,a:Math.PI},R:{x:1,y:0,a:0},U:{x:0,y:-1,a:-Math.PI/2},D:{x:0,y:1,a:Math.PI/2}};
// x,y are grid coordinates. w/h are in grid squares; all levels are deliberately hand-designed.
const levels=[
 [ ['cyan',0.1,0.25,2.25,.86,'L','bus'],['purple',3.05,.25,1.0,2.12,'U','car'],['yellow',5.2,.25,2.3,.86,'L','bus'],['green',.1,1.55,.86,2.08,'U','car'],['orange',1.25,1.18,1.9,.86,'L','car'],['pink',6.2,1.25,1.85,.86,'L','car'],['blue',7.2,1.3,.86,1.7,'D','car'],['green',1.0,2.35,1.9,.86,'L','bus'],['purple',2.1,2.25,.86,1.8,'U','car'],['cyan',3.7,2.38,2.05,.86,'U','bus'],['yellow',5.2,1.55,.86,2.0,'U','car'],['pink',6.2,2.37,1.8,.86,'L','car'],['red',.1,4.0,.86,1.75,'U','car'],['purple',1.65,3.55,1.88,.86,'L','car'],['orange',3.3,3.52,1.7,.86,'L','car'],['red',5.05,3.52,1.72,.86,'L','car'],['orange',6.9,3.65,.86,1.85,'U','car'],['cyan',.15,5.95,2.22,.86,'R','bus'],['pink',2.62,5.1,.86,1.8,'D','car'],['green',3.7,4.62,1.8,.86,'L','car'],['orange',5.65,4.65,1.84,.86,'R','bus'],['yellow',6.6,5.25,.86,2.12,'D','bus'],['purple',3.3,6.35,1.85,.86,'R','car'],['blue',5.2,6.35,1.88,.86,'R','bus'],['green',7.15,6.5,.86,1.85,'D','car'],['brown',1.25,7.6,1.9,.86,'R','bus'],['pink',3.3,7.55,.86,1.82,'D','car'],['orange',4.35,7.65,2.15,.86,'R','bus'] ],
 [ ['red',.1,.35,.86,2.1,'U','car'],['cyan',1.15,.25,2.3,.86,'L','bus'],['yellow',4.0,.3,2.28,.86,'R','bus'],['purple',6.7,.25,.86,2.13,'D','car'],['green',.9,1.45,1.9,.86,'L','car'],['orange',3.0,1.4,.86,2.05,'U','car'],['pink',4.35,1.5,1.95,.86,'L','bus'],['blue',6.25,2.15,1.72,.86,'R','car'],['yellow',.1,3.05,2.18,.86,'R','bus'],['purple',2.45,2.8,.86,1.83,'D','car'],['cyan',3.65,3.1,2.08,.86,'R','bus'],['green',6.1,3.2,.86,1.88,'U','car'],['orange',.25,4.45,.86,1.87,'U','car'],['red',1.3,4.62,1.82,.86,'L','car'],['pink',3.45,4.45,.86,2.05,'D','car'],['brown',4.65,4.6,1.82,.86,'R','car'],['yellow',6.55,4.75,1.9,.86,'L','bus'],['blue',.15,6.32,2.35,.86,'R','bus'],['green',2.78,6.05,.86,1.9,'D','car'],['purple',3.85,6.28,1.85,.86,'L','car'],['orange',5.85,6.15,.86,2.2,'D','bus'],['pink',1.3,7.55,1.9,.86,'R','bus'],['cyan',3.55,7.6,2.25,.86,'R','bus'],['red',6.5,7.48,1.82,.86,'L','car'] ],
 [ ['purple',.15,.3,2.2,.86,'L','bus'],['cyan',2.65,.25,.86,2.1,'U','car'],['orange',3.85,.25,2.1,.86,'L','bus'],['yellow',6.3,.3,1.7,.86,'L','car'],['green',.15,1.52,.86,2.05,'U','car'],['pink',1.4,1.35,1.8,.86,'L','car'],['blue',3.65,1.5,.86,1.85,'D','car'],['red',4.8,1.42,1.9,.86,'R','car'],['purple',6.85,1.35,.86,1.9,'U','car'],['yellow',.95,2.82,1.85,.86,'R','car'],['cyan',2.15,3.4,.86,1.8,'D','car'],['green',3.25,2.85,2.15,.86,'L','bus'],['orange',5.72,2.72,.86,2.12,'U','bus'],['pink',6.62,3.12,1.75,.86,'R','car'],['red',.2,4.72,2.12,.86,'R','bus'],['purple',2.55,4.65,1.75,.86,'L','car'],['yellow',4.5,4.62,1.9,.86,'R','car'],['blue',6.85,4.55,.86,2.05,'D','car'],['cyan',.22,6.2,.86,1.85,'U','car'],['orange',1.4,6.05,1.95,.86,'L','bus'],['green',3.6,6.15,2.15,.86,'R','bus'],['pink',6.05,6.25,1.7,.86,'L','car'],['yellow',1.0,7.55,2.3,.86,'R','bus'],['red',3.65,7.52,.86,1.85,'D','car'],['purple',4.82,7.48,2.25,.86,'R','bus'] ]
];
function setup(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;unit=Math.min(W/8.6,H/10.3);ox=(W-unit*8)/2;oy=(H-unit*9.35)/2;draw()}
function load(n){stage=n%levels.length;cars=levels[stage].map((c,i)=>({id:i,color:c[0],x:c[1],y:c[2],w:c[3],h:c[4],dir:c[5],type:c[6],gone:false,shake:0,glow:0}));hintUses=3;shuffleUses=1;els.hint.querySelector('small').textContent=hintUses;els.shuffle.querySelector('small').textContent=shuffleUses;els.stage.textContent='STAGE '+(stage+1);els.modal.classList.remove('show');update();draw()}
function update(){els.remaining.textContent=cars.filter(c=>!c.gone).length}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.closePath()}
function rect(c){return{x:ox+c.x*unit,y:oy+c.y*unit,w:c.w*unit,h:c.h*unit}}
function draw(){ctx.clearRect(0,0,W,H);const bx=ox-unit*.26,by=oy-unit*.26,bw=unit*8.52,bh=unit*9.88;ctx.save();ctx.shadowColor='#27476755';ctx.shadowBlur=18;ctx.shadowOffsetY=9;rr(bx,by,bw,bh,26);ctx.fillStyle='#cfdae7';ctx.fill();ctx.restore();rr(bx,by,bw,bh,26);ctx.fillStyle='#dce6f0';ctx.fill();
ctx.save();ctx.globalAlpha=.26;for(let i=0;i<9;i++){for(let j=0;j<10;j++){ctx.fillStyle=(i+j)%2?'#b7c7d9':'#edf3f9';rr(ox+i*unit-.07*unit,oy+j*unit-.07*unit,unit*.12,unit*.12,4);ctx.fill()}}ctx.restore();
// exits on each edge
ctx.fillStyle='#9bb1ca';for(let i=0;i<4;i++){const p=[{x:ox+unit*3.2,y:oy-unit*.2,w:unit*1.6,h:unit*.22},{x:ox+unit*3.2,y:oy+unit*9.25,w:unit*1.6,h:unit*.22},{x:ox-unit*.22,y:oy+unit*4.1,w:unit*.22,h:unit*1.5},{x:ox+unit*8,y:oy+unit*4.1,w:unit*.22,h:unit*1.5}][i];ctx.fillRect(p.x,p.y,p.w,p.h)}
cars.filter(c=>!c.gone).forEach(drawCar);requestAnimationFrame(()=>{if(cars.some(c=>c.shake>0||c.glow>0))draw()})}
function drawCar(c){let r=rect(c),[light,dark]=palette[c.color],s=Math.sin(c.shake*30)*4*c.shake;r.x+=s;ctx.save();ctx.shadowColor='#172d4b88';ctx.shadowBlur=7;ctx.shadowOffsetY=5;rr(r.x,r.y,r.w,r.h,unit*.16);ctx.fillStyle=dark;ctx.fill();ctx.restore();
rr(r.x,r.y,r.w,r.h,unit*.16);let g=ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);g.addColorStop(0,light);g.addColorStop(.55,light);g.addColorStop(1,dark);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#ffffff99';ctx.stroke();
ctx.save();rr(r.x+3,r.y+3,r.w-6,r.h*.48,unit*.12);ctx.clip();ctx.fillStyle='#dff8ff99';ctx.fill();ctx.restore();
// wheels
ctx.fillStyle='#243344';if(c.w>c.h){for(const x of [r.x+r.w*.19,r.x+r.w*.77]){ctx.fillRect(x,r.y-2,unit*.2,5);ctx.fillRect(x,r.y+r.h-3,unit*.2,5)}}else{for(const y of [r.y+r.h*.18,r.y+r.h*.75]){ctx.fillRect(r.x-2,y,5,unit*.2);ctx.fillRect(r.x+r.w-3,y,5,unit*.2)}}
// arrow
const cx=r.x+r.w/2,cy=r.y+r.h/2,ang=D[c.dir].a;ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);let len=Math.max(r.w,r.h)*.31,th=Math.min(r.w,r.h)*.18;ctx.shadowColor='#20354c';ctx.shadowBlur=2;ctx.fillStyle='white';ctx.strokeStyle='#31506f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(len,0);ctx.lineTo(len-th, -th);ctx.lineTo(len-th,-th*.42);ctx.lineTo(-len,-th*.42);ctx.lineTo(-len,th*.42);ctx.lineTo(len-th,th*.42);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
if(c.glow>0){ctx.save();ctx.globalAlpha=c.glow;ctx.strokeStyle='#ffdf3d';ctx.lineWidth=5;rr(r.x-3,r.y-3,r.w+6,r.h+6,unit*.18);ctx.stroke();ctx.restore();c.glow=Math.max(0,c.glow-.035)}c.shake=Math.max(0,c.shake-.04)}
function overlap(a,b){return a.x<b.x+b.w-.02&&a.x+a.w>b.x+.02&&a.y<b.y+b.h-.02&&a.y+a.h>b.y+.02}
function canLeave(c){const q={x:c.x,y:c.y,w:c.w,h:c.h};if(c.dir==='L'){q.w=q.x;q.x=0}else if(c.dir==='R'){q.w=8-q.x}else if(c.dir==='U'){q.h=q.y;q.y=0}else{q.h=9.2-q.y}return !cars.some(o=>o!==c&&!o.gone&&overlap(q,o))}
function tone(freq=420,dur=.06){if(muted)return;try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.07,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function toast(t){els.toast.textContent=t;els.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>els.toast.classList.remove('show'),1050)}
function leave(c){if(animating)return;animating=true;tone(570,.09);let speed=0;const go=()=>{speed+=.06;c.x+=D[c.dir].x*speed;c.y+=D[c.dir].y*speed;draw();let r=rect(c);if(r.x+r.w<-20||r.x>W+20||r.y+r.h<-20||r.y>H+20){c.gone=true;animating=false;update();tone(780,.1);if(!cars.some(v=>!v.gone))setTimeout(clear,350);return}requestAnimationFrame(go)};go()}
function clear(){els.clearText.textContent=`STAGE ${stage+1} をクリア！ ${cars.length} 台を脱出させました`;els.modal.classList.add('show');tone(880,.18)}
function chooseAt(px,py){for(const c of [...cars].reverse()){if(c.gone)continue;let r=rect(c);if(px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h)return c}return null}
canvas.addEventListener('pointerdown',e=>{if(animating)return;const r=canvas.getBoundingClientRect(),c=chooseAt(e.clientX-r.left,e.clientY-r.top);if(!c)return;if(canLeave(c))leave(c);else{c.shake=1;tone(155,.1);toast('進路がふさがれています！');draw()}});
els.restart.onclick=()=>load(stage);els.next.onclick=()=>load(stage+1);els.sound.onclick=()=>{muted=!muted;els.sound.textContent=muted?'🔇':'♫';toast(muted?'サウンド OFF':'サウンド ON')};
els.hint.onclick=()=>{if(!hintUses)return toast('ヒントは使い切りました');const c=cars.find(v=>!v.gone&&canLeave(v));if(!c)return toast('動かせる車がありません');hintUses--;els.hint.querySelector('small').textContent=hintUses;c.glow=1;toast('光っている車を出そう！');draw()};
els.shuffle.onclick=()=>{if(!shuffleUses)return toast('シャッフルは使い切りました');shuffleUses--;els.shuffle.querySelector('small').textContent=shuffleUses;const active=cars.filter(c=>!c.gone);for(let i=active.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[active[i].color,active[j].color]=[active[j].color,active[i].color]}toast('カラーをシャッフル！');draw()};
new ResizeObserver(setup).observe(document.querySelector('#gameWrap'));load(0);
})();
</script></body></html>
